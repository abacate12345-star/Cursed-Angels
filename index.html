<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursed Angels</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }

    h1 {
        font-size: 60px;
        color: #a855f7;
        text-shadow: 0 0 10px #a855f7, 0 0 20px #6d28d9, 0 0 40px #6d28d9;
        margin-bottom: 10px;
    }

    p {
        color: #aaa;
        margin-bottom: 40px;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 250px;
    }

    a {
        text-decoration: none;
        text-align: center;
        padding: 15px;
        border-radius: 15px;
        font-weight: bold;
        transition: 0.3s;
    }

    .discord {
        background: #6d28d9;
        color: white;
        box-shadow: 0 0 20px #a855f7;
    }

    .discord:hover {
        background: #7c3aed;
        transform: scale(1.05);
    }

    .roblox {
        background: black;
        border: 2px solid #a855f7;
        color: white;
        box-shadow: 0 0 20px #6d28d9;
    }

    .roblox:hover {
        background: #1a001f;
        transform: scale(1.05);
    }

    .footer {
        margin-top: 40px;
        font-size: 12px;
        color: #444;
    }

    /* glow fundo leve */
    .glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: #6d28d9;
        filter: blur(150px);
        opacity: 0.2;
        border-radius: 50%;
        z-index: -1;
    }
</style>
</head>

<body>

<div class="glow"></div>

<h1>CURSED ANGELS</h1>
<p>entra no nosso universo 😈</p>

<div class="container">
    <a class="discord" href="https://discord.gg/aMcpeHSd" target="_blank">
        Entrar no Discord
    </a>

    <a class="roblox" href="https://www.roblox.com/share?code=615235946988894185008979dc90dd6b&type=Server" target="_blank">
        Jogar no Roblox
    </a>
</div>

<div class="footer">
    cursed angels • community server
</div>

</body>
</html>
